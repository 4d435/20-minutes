<!DOCTYPE html>
<html lang="en-us">
  <head>
    <base href="https://cdn.jsdelivr.net/gh/web-ports/20-minutes@main/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | 20 Minutes Till Dawn</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      :root {
        --bg: #05070d;
        --panel: rgba(12, 16, 22, 0.9);
        --border: rgba(255, 255, 255, 0.14);
        --text: #edf7ff;
        --muted: rgba(237, 247, 255, 0.72);
        --accent: #7be0ff;
        --accent-2: #ffb454;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        overflow: hidden;
      }

      body {
        position: relative;
      }

      #loading-overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: radial-gradient(circle at top, rgba(44, 62, 84, 0.7), rgba(5, 7, 13, 1) 62%);
      }

      #loading-panel {
        width: min(680px, calc(100vw - 40px));
        padding: 24px 22px 18px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: rgba(7, 12, 18, 0.8);
        backdrop-filter: blur(4px);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      }

      #loading-title {
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        margin: 0 0 10px;
        font-size: clamp(24px, 2.5vw, 36px);
        background: linear-gradient(90deg, #ff4d4d, #ff9a3c, #ffe66d, #79e7b5, #6fd6ff, #a799ff);
        background-size: 200% 200%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: shimmer 2.6s ease infinite;
      }

      #loading-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
        color: var(--muted);
        font-size: 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      #loading-percent {
        font-weight: 700;
        color: #ffffff;
      }

      #loading-progress {
        width: 100%;
        height: 18px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.12);
      }

      #loading-progress-fill {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        box-shadow: 0 0 18px rgba(123, 224, 255, 0.7);
        transition: width 150ms linear;
      }

      #debug-toggle {
        appearance: none;
        border: 1px solid var(--border);
        background: rgba(10, 15, 20, 0.75);
        color: var(--text);
        padding: 8px 14px;
        border-radius: 999px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
      }

      #debug-panel {
        width: min(480px, calc(100vw - 32px));
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(8, 12, 18, 0.8);
        display: grid;
        gap: 8px;
        font-size: 12px;
        line-height: 1.4;
        color: var(--muted);
      }

      .debug-row {
        display: flex;
        justify-content: space-between;
        gap: 18px;
      }

      .debug-row strong {
        color: var(--text);
      }

      @keyframes shimmer {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
    </style>
  </head>
  <body>
    <div id="loading-overlay">
      <div id="loading-panel">
        <div id="loading-title">LOADING</div>
        <div id="loading-meta">
          <div id="loading-bytes">(0.00/0.00 MB)</div>
          <div id="loading-percent">0% DONE</div>
        </div>
        <div id="loading-progress">
          <div id="loading-progress-fill"></div>
        </div>
      </div>

      <button id="debug-toggle" type="button">Debug</button>

      <div id="debug-panel" hidden>
        <div class="debug-row"><span>Download</span><strong id="debug-download">0.00/0.00 MB</strong></div>
        <div class="debug-row"><span>Progress</span><strong id="debug-percent">0% DONE</strong></div>
        <div class="debug-row"><span>Window</span><strong id="debug-window">0x0</strong></div>
        <div class="debug-row"><span>User Agent</span><strong id="debug-agent">unknown</strong></div>
      </div>
    </div>

    <div id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      const loadingBytes = document.querySelector("#loading-bytes");
      const loadingPercent = document.querySelector("#loading-percent");
      const loadingProgressFill = document.querySelector("#loading-progress-fill");
      const debugDownload = document.querySelector("#debug-download");
      const debugPercent = document.querySelector("#debug-percent");
      const debugWindow = document.querySelector("#debug-window");
      const debugAgent = document.querySelector("#debug-agent");
      const debugPanel = document.querySelector("#debug-panel");
      const debugToggle = document.querySelector("#debug-toggle");

      const downloadState = {
        totalBytes: 0,
        loadedBytes: 0,
      };

      function updateDebugInfo() {
        const loadedMB = (downloadState.loadedBytes / (1024 * 1024)).toFixed(2);
        const totalMB = (downloadState.totalBytes / (1024 * 1024)).toFixed(2);
        const pct = downloadState.totalBytes > 0 ? (downloadState.loadedBytes / downloadState.totalBytes) * 100 : 0;
        loadingBytes.textContent = `(${loadedMB}/${totalMB} MB)`;
        loadingPercent.textContent = `${Math.min(100, Math.round(pct))}% DONE`;
        loadingProgressFill.style.width = `${Math.min(100, Math.max(0, pct))}%`;
        debugDownload.textContent = `${loadedMB}/${totalMB} MB`;
        debugPercent.textContent = `${Math.min(100, Math.round(pct))}% DONE`;
        debugWindow.textContent = `${window.innerWidth}x${window.innerHeight}`;
        debugAgent.textContent = navigator.userAgent.slice(0, 80);
      }

      debugToggle.addEventListener("click", () => {
        const isHidden = debugPanel.hasAttribute("hidden");
        debugPanel.toggleAttribute("hidden", !isHidden);
        debugToggle.textContent = isHidden ? "Hide Debug" : "Debug";
      });

      window.addEventListener("keydown", (event) => {
        if (event.key.toLowerCase() === "d") {
          const isHidden = debugPanel.hasAttribute("hidden");
          debugPanel.toggleAttribute("hidden", !isHidden);
          debugToggle.textContent = isHidden ? "Hide Debug" : "Debug";
        }
      });

      async function fetchWithProgress(url) {
        const response = await fetch(url);
        const contentLength = Number(response.headers.get("content-length") || 0);
        if (contentLength > 0) {
          downloadState.totalBytes += contentLength;
        }

        const reader = response.body.getReader();
        const chunks = [];
        let received = 0;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          received += value.length;
          downloadState.loadedBytes += value.length;
          chunks.push(value);
          updateDebugInfo();
        }

        const fullBuffer = new Uint8Array(received);
        let offset = 0;
        for (const chunk of chunks) {
          fullBuffer.set(chunk, offset);
          offset += chunk.length;
        }

        return fullBuffer.buffer;
      }

      async function mergeFiles(fileParts, cacheKey) {
        const cache = await caches.open("20mins-cache");
        const cachedResponse = await cache.match(cacheKey);
        if (cachedResponse) {
          const blob = await cachedResponse.blob();
          return URL.createObjectURL(blob);
        }

        const buffers = await Promise.all(fileParts.map(part => fetchWithProgress(part)));
        const mergedBlob = new Blob(buffers);
        const response = new Response(mergedBlob);
        await cache.put(cacheKey, response);
        return URL.createObjectURL(mergedBlob);
      }

      function getParts(file, start, end) {
        const parts = [];
        for (let i = start; i <= end; i++) {
          parts.push(file + ".part" + i);
        }
        return parts;
      }

      (async () => {
        updateDebugInfo();

        const [dataUrl, wasmUrl] = await Promise.all([
          mergeFiles(getParts("Build/20minutes.data", 1, 2), "20minutes.data"),
          mergeFiles(getParts("Build/20minutes.wasm", 1, 2), "20minutes.wasm"),
        ]);

        const container = document.querySelector("#unity-container");
        const canvas = document.querySelector("#unity-canvas");
        const loadingBar = document.querySelector("#unity-loading-bar");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");
        const warningBanner = document.querySelector("#unity-warning");

        function unityShowBanner(msg, type) {
          // intentionally blank to avoid default banner noise
        }

        const buildUrl = "Build";
        const loaderUrl = buildUrl + "/20minutes.loader.js";
        const config = {
          arguments: [],
          dataUrl: dataUrl,
          frameworkUrl: buildUrl + "/20minutes.framework.js",
          codeUrl: wasmUrl,
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Flanne",
          productName: "MinutesTillDawn",
          productVersion: "0.6.6",
          showBanner: unityShowBanner,
        };

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          const meta = document.createElement("meta");
          meta.name = "viewport";
          meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
          document.getElementsByTagName("head")[0].appendChild(meta);
        }

        loadingBar.style.display = "block";

        const script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            const percent = Math.min(100, Math.round(progress * 100));
            progressBarFull.style.width = percent + "%";
            if (downloadState.totalBytes > 0) {
              loadingPercent.textContent = `${percent}% DONE`;
              loadingProgressFill.style.width = `${percent}%`;
              debugPercent.textContent = `${percent}% DONE`;
            }
          }).then((unityInstance) => {
            loadingBar.style.display = "none";
            document.querySelector("#loading-overlay").style.display = "none";
            container.style.display = "block";
          }).catch((message) => {
            alert(message);
          });
        };
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
