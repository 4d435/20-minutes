<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>20 Minutes Till Dawn</title>
    <style>
      :root {
        --bg: #070b12;
        --bg-2: #101a26;
        --panel: rgba(18, 23, 32, 0.85);
        --panel-border: rgba(255,255,255,0.12);
        --text: #edf3ff;
        --muted: #b9c8db;
        --accent: #ff8f49;
        --accent-2: #ffca69;
        --shadow: rgba(0,0,0,0.42);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 50% 20%, rgba(255, 143, 73, 0.18), transparent 28%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .backdrop {
        position: fixed;
        inset: 0;
        background:
          repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,0.02),
            rgba(255,255,255,0.02) 1px,
            transparent 1px,
            transparent 5px
          );
        pointer-events: none;
      }

      .card {
        position: relative;
        z-index: 1;
        width: min(760px, calc(100vw - 32px));
        padding: 38px 26px 32px;
        border: 1px solid var(--panel-border);
        border-radius: 22px;
        background: rgba(12, 16, 22, 0.72);
        backdrop-filter: blur(10px);
        box-shadow: 0 22px 60px var(--shadow);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 10px;
        font-size: 12px;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: var(--muted);
      }

      h1 {
        margin: 0;
        font-size: clamp(32px, 6vw, 70px);
        letter-spacing: 0.12em;
        line-height: 1.05;
        text-transform: uppercase;
        text-shadow: 0 0 20px rgba(255, 170, 85, 0.25);
      }

      .subtitle {
        margin: 22px auto 28px;
        max-width: 600px;
        font-size: clamp(14px, 2vw, 20px);
        line-height: 1.6;
        color: var(--muted);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 16px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 200px;
        padding: 16px 28px;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.08);
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
        color: #1b1109;
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-decoration: none;
        box-shadow: 0 8px 22px rgba(255, 165, 81, 0.28);
        transition: transform 0.18s ease, box-shadow 0.18s ease;
      }

      .button:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 28px rgba(255, 165, 81, 0.36);
      }

      .button.secondary {
        background: rgba(255,255,255,0.03);
        color: var(--text);
        border-color: rgba(255,255,255,0.12);
        box-shadow: none;
      }

      .meta {
        margin-top: 28px;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="backdrop"></div>

    <main class="card">
      <p class="eyebrow">survival game</p>
      <h1>20 Minutes Till Dawn</h1>
      <p class="subtitle">
        A dark, fast-paced survival experience. Launch the game below and keep moving until sunrise.
      </p>

      <div class="actions">
        <a class="button" href="game.html">Play now</a>
        <a class="button secondary" href="https://github.com/4d435/20-minutes" target="_blank" rel="noreferrer">GitHub</a>
      </div>

      <div class="meta">Local host: http://localhost:8000</div>
    </main>
  </body>
</html>
