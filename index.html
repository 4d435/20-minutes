<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Embedded Site</title>
    <style>
      :root {
        --bg: #05070b;
        --panel: rgba(18, 22, 30, 0.9);
        --line: rgba(255, 255, 255, 0.12);
        --text: #edf3ff;
        --muted: #b7c5d8;
        --accent: #5db2ff;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        overflow: hidden;
      }

      .frame-wrap {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: #000;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #fff;
      }

      .fallback {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(5, 7, 11, 0.95);
        padding: 20px;
        text-align: center;
      }

      .fallback.show {
        display: flex;
      }

      .fallback-card {
        max-width: 560px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--panel);
        padding: 28px 24px;
        box-shadow: 0 18px 40px rgba(0,0,0,0.4);
      }

      .fallback h1 {
        margin: 0 0 14px;
        font-size: clamp(24px, 4vw, 42px);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .fallback p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
        font-size: 16px;
      }

      .fallback a {
        display: inline-block;
        margin-top: 18px;
        padding: 12px 18px;
        border-radius: 10px;
        background: var(--accent);
        color: #04131d;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="frame-wrap">
      <iframe
        id="siteFrame"
        src="https://ksp.ishotupa.school/"
        title="Embedded site"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>

      <div id="fallback" class="fallback" aria-live="polite">
        <div class="fallback-card">
          <h1>Blocked by the site</h1>
          <p>
            This page is set to load the target site inside an iframe, but the target website may be
            blocking embedding. Open it directly instead.
          </p>
          <a href="https://ksp.ishotupa.school/" target="_blank" rel="noreferrer">Open site directly</a>
        </div>
      </div>
    </div>

    <script>
      const frame = document.getElementById('siteFrame');
      const fallback = document.getElementById('fallback');

      frame.addEventListener('load', () => {
        try {
          const sameOrigin = frame.contentWindow && frame.contentWindow.location && frame.contentWindow.location.href;
          if (!sameOrigin || sameOrigin === 'about:blank') {
            fallback.classList.add('show');
          }
        } catch (e) {
          fallback.classList.add('show');
        }
      });
    </script>
  </body>
</html>
